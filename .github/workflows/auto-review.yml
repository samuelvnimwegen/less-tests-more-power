name: Auto review

# Runs the auto-review skill on each of my PRs into development and posts the result as claude[bot].
# It runs on my Claude subscription through the CLAUDE_CODE_OAUTH_TOKEN secret.
on:
  pull_request:
    types: [opened, ready_for_review]
    branches: [development]

jobs:
  review:
    # Only my own PRs that are ready. GitHub also withholds secrets from fork PRs.
    if: github.event.pull_request.user.login == 'samuelvnimwegen' && !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: auto-review-${{ github.event.pull_request.number }}
    permissions:
      contents: read
      pull-requests: read
      issues: read

      # The action trades this for a Claude GitHub App token, which is why the review shows as claude[bot].
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: astral-sh/setup-uv@v10.3.3
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: /auto-review ${{ github.event.pull_request.number }}
          claude_args: |
            --model claude-opus-5-5
            --allowedTools "Bash,Read,Write,Glob,Grep,Agent,Skill"
