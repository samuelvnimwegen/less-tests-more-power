[project]
name = "lesstests"
version = "0.1.0"
description = "Records REST API test suites through a proxy and cuts them down by black box coverage."
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "pyyaml>=6.0",
    "scipy>=1.13",
]

[project.scripts]
lesstests = "lesstests.cli:main"

[dependency-groups]
dev = [
    "basedpyright>=1.20",
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lesstests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: needs Docker, Java and Maven, skipped unless LESSTESTS_LIVE=1"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "D", "DOC"]
ignore = ["D100", "D104", "D203", "D213", "N803", "N806"]
preview = true

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "DOC"]

[tool.ruff.format]
quote-style = "double"

[tool.basedpyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
